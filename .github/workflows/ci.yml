name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package script guard
        run: pnpm exec tsx tests/package-scripts-regression.test.ts

      - name: Core regression smoke
        run: pnpm exec tsx tests/security-regression.test.ts && pnpm exec tsx tests/git-regression.test.ts && pnpm exec tsx tests/mcp-config-regression.test.ts && pnpm exec tsx tests/metrics-cache-regression.test.ts

      - name: Vitest suite
        run: pnpm test:vitest

      - name: Main TypeScript
        run: pnpm exec tsc --noEmit -p tsconfig.json --allowImportingTsExtensions

      - name: Renderer TypeScript
        run: pnpm exec tsc --noEmit -p tsconfig.renderer.json
